[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mneme"
version = "1.0.0"
description = "Context-aware memory router for AI agents."
authors = [{ name = "MNEME Contributors", email = "hello@mneme.dev" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.30.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.0.26"]
crewai = ["crewai==0.80.0"]
autogen = ["pyautogen>=0.2.35,<0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/mneme"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
