<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>MNEME</h2>
      <p>Context Router</p>
    </div>
    
    <div class="form-group">
      <label for="apiUrl">API URL</label>
      <input type="text" id="apiUrl" placeholder="https://api.mneme.dev/v1">
    </div>

    <div class="form-group">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="mnk_...">
    </div>

    <div class="form-group">
      <label for="vaultId">Vault ID</label>
      <input type="text" id="vaultId" placeholder="vlt_...">
      <p class="help">Required. Use the vault ID from your API.</p>
    </div>

    <div class="form-group">
      <label for="budgetTokens">Budget (Tokens)</label>
      <input type="number" id="budgetTokens" min="1" max="100000" value="1000">
    </div>

    <button id="saveBtn">Save Configuration</button>
    
    <div id="status" role="status" aria-live="polite" class="status-hidden">Saved!</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
